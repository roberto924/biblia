<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblia · Compañero de lectura</title>
<meta name="description" content="Lee la Biblia paso a paso, libro a libro, con las personas, vínculos, edades y lugares de cada versículo y su fuente.">
<meta name="theme-color" content="#e8eae6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

</head>
<body>
<a class="saltar" href="#principal">Saltar al contenido</a>
<div class="marco">

    <a class="marca" href="#leer" aria-label="Compañero de lectura, inicio">

      <span class="marca-texto"><span class="marca-nombre">Compañero de lectura</span><span class="marca-libro">Biblia</span></span>
    </a>
  </header>
  <nav class="nav-principal" aria-label="Secciones">
    <a href="#leer" data-vista="leer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.2 6-1.2 9 .8 3-2 6-2 9-.8v13c-3-1.2-6-1.2-9 .8-3-2-6-2-9-.8z"/><path d="M12 6.3v13.4"/></svg><span>Leer</span></a>
    <a href="#personajes" data-vista="personajes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="11" height="15" rx="2"/><path d="M17.5 7.5l2.2.6a1.5 1.5 0 011 1.8l-2.6 9.7a1.5 1.5 0 01-1.8 1.1l-3.1-.8"/><circle cx="9" cy="10.5" r="2.2"/><path d="M5.8 17c.5-1.9 1.7-3 3.2-3s2.7 1.1 3.2 3"/></svg><span>Personajes</span></a>
    <a href="#arbol" data-vista="arbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4M12 10.5c-4 0-6 1-6 4M12 10.5c4 0 6 1 6 4M12 10.5v4"/><circle cx="6" cy="17" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg><span>Árbol</span></a>
    <a href="#tiempo" data-vista="tiempo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18" opacity=".5"/><circle cx="7" cy="6.5" r="1.8"/><circle cx="7" cy="12" r="1.8"/><circle cx="7" cy="17.5" r="1.8"/><path d="M11 6.5h9M11 12h6M11 17.5h8"/></svg><span>Tiempo</span></a>
    <a href="#mapa" data-vista="mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Mapa</span></a>
    <a href="#fuentes" data-vista="fuentes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg><span>Fuentes</span></a>

  <main id="principal" tabindex="-1"><p>Cargando…</p></main>

<dialog id="ficha" aria-labelledby="ficha-titulo">
  <div class="dialogo-cab"><h2 id="ficha-titulo">Persona</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar ficha"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
  <div class="dialogo-cuerpo"></div>
</dialog>
<dialog id="detalle" aria-labelledby="detalle-titulo">
  <div class="dialogo-cab"><h2 id="detalle-titulo">Detalle</h2><button type="button" class="cerrar" data-cerrar aria-label="Cerrar detalle"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
  <div class="dialogo-cuerpo"></div>
</dialog>

<dialog id="visor" class="visor" aria-labelledby="visor-titulo">
  <div class="dialogo-cab visor-cab"><h2 id="visor-titulo">Imagen</h2>
    <div class="visor-zoom" role="group" aria-label="Zoom">
      <button type="button" class="boton mini-boton secundario" data-vzoom="-1" aria-label="Alejar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
      <output id="visor-pct" aria-live="polite">100 %</output>
      <button type="button" class="boton mini-boton secundario" data-vzoom="1" aria-label="Acercar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
      <button type="button" class="boton mini-boton secundario" data-vzoom="0">Ajustar</button></div>
    <button type="button" class="cerrar" data-cerrar aria-label="Cerrar visor"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
  <div class="visor-lienzo" id="visor-lienzo"></div>
  <div class="visor-pie" id="visor-pie"></div>
</dialog>

<div id="nuevas" class="nuevas" role="status" aria-live="polite" hidden></div>
<div id="aviso" class="aviso" role="status" hidden>Hay una versión nueva <button type="button" id="actualizar" class="boton">Actualizar</button></div>

<script src="datos/biblia.js"></script>
<script src="datos/mapa-base.js"></script>
<script src="datos/recursos.js"></script>
<script src="app.js"></script>
</body>
</html>
